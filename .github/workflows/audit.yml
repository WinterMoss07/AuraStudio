name: Audit

# Known security advisories (RustSec) against Cargo.lock: on every change
# of the dependencies, and every Monday for advisories published since.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml", .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a vulnerability; unmaintained or yanked crates are listed
      # as warnings.
      - run: cargo audit
