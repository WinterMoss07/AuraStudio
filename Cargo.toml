[workspace]
resolver = "2"
members = [
    "crates/aurastudio-core",
    "crates/aurastudio-raster",
    "crates/aurastudio-selection",
    "crates/aurastudio-transform",
    "crates/aurastudio-forge",
    "crates/aurastudio-forge-library",
    "crates/aurastudio-layers",
    "crates/aurastudio-document",
    "crates/aurastudio-color",
    "crates/aurastudio-input",
    "crates/aurastudio-gpu",
    "crates/aurastudio-ui",
    "crates/aurastudio-file",
    "crates/aurastudio-filters",
    "crates/aurastudio-app",
]

[patch.crates-io]
# egui_dock 0.21 with AuraStudio's drop indicators (red bar between docks,
# red tab bar to join one), see NOTICE.md.
egui_dock = { path = "vendor/egui_dock" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

# CI builds: optimized like release, thin LTO and parallel codegen (a few
# % slower at most, several times faster to build).
[profile.ci]
inherits      = "release"
lto           = "thin"
codegen-units = 16

[workspace.package]
# One version for the whole app (see README, Versioning).
version = "0.19.1"
