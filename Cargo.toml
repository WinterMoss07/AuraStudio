[workspace]
resolver = "2"
members = [
    "crates/aurastudio-canvas",
    "crates/aurastudio-brush",
    "crates/aurastudio-brushes",
    "crates/aurastudio-layers",
    "crates/aurastudio-document",
    "crates/aurastudio-color",
    "crates/aurastudio-input",
    "crates/aurastudio-gpu",
    "crates/aurastudio-ui",
    "crates/aurastudio-file",
    "crates/aurastudio-filters",
    "crates/aurastudio-app",
]

# egui 0.30 with one upstream crash fix (vendor/egui/src/memory/mod.rs,
# compare_order). Drop this once egui is upgraded to 0.31 or later.
[patch.crates-io]
egui = { path = "vendor/egui" }
# egui_dock 0.15 with AuraStudio's drop indicators (red bar between docks,
# red tab bar to join one), see NOTICE.md.
egui_dock = { path = "vendor/egui_dock" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

# CI builds: optimized like release, thin LTO and parallel codegen (a few
# % slower at most, several times faster to build).
[profile.ci]
inherits      = "release"
lto           = "thin"
codegen-units = 16

[workspace.package]
# One version for the whole app (see README, Versioning).
version = "0.10.3"
