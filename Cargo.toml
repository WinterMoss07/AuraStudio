[workspace]
resolver = "2"
members = [
    # Rebuilt crate by crate on rework/foundations (one function per crate;
    # the dependency table is in crates/aurastudio-arch).
    "crates/aurastudio-core",
    "crates/aurastudio-arch",
    "crates/aurastudio-raster",
    "crates/aurastudio-input",
    "crates/aurastudio-filters",
    "crates/aurastudio-transform",
    "crates/aurastudio-selection",
    "crates/aurastudio-diag",
    "crates/aurastudio-stress",
]

[patch.crates-io]
# egui_dock 0.21 with AuraStudio's drop indicators (red bar between docks,
# red tab bar to join one), see NOTICE.md.
egui_dock = { path = "vendor/egui_dock" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
# File and line of each function, no other debug info: crash report
# backtraces and Tracy can name them (the .pdb beside the .exe on
# Windows). Changes nothing in the code that runs.
debug         = "line-tables-only"

# Debug builds: the dependencies (wgpu, egui, image...) optimized, so a
# debug build is fast enough to draw with; the workspace's own crates stay
# unoptimized and quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

# CI builds: optimized like release, thin LTO and parallel codegen (a few
# % slower at most, several times faster to build).
[profile.ci]
inherits      = "release"
lto           = "thin"
codegen-units = 16

[workspace.package]
# One version for the whole app (see README, Versioning).
version = "0.19.6"
