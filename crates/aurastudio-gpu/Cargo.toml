[package]
name = "aurastudio-gpu"
version.workspace = true
edition = "2021"

[dependencies]
aurastudio-core = { path = "../aurastudio-core" }
aurastudio-animation = { path = "../aurastudio-animation" }
# OpenGL too ("angle" turns the GL backend on where it is off by
# default: WGL on Windows), the fallback when Vulkan is missing.
wgpu              = { version = "30", features = ["angle"] }
bytemuck          = { version = "1", features = ["derive"] }
log               = "0.4"
half      = "2"
profiling = "1"

[dev-dependencies]
aurastudio-layers = { path = "../aurastudio-layers" }
pollster = "0.4"
