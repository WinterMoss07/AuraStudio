[package]
name = "aurastudio-gpu"
version.workspace = true
edition = "2021"

[dependencies]
aurastudio-canvas = { path = "../aurastudio-canvas" }
aurastudio-layers = { path = "../aurastudio-layers" }
# OpenGL too ("angle" turns the GL backend on where it is off by
# default: WGL on Windows), the fallback when Vulkan is missing.
wgpu              = { version = "30", features = ["angle"] }
winit             = "0.30"
bytemuck          = { version = "1", features = ["derive"] }
log               = "0.4"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
half      = "2"

[dev-dependencies]
pollster = "0.3"
