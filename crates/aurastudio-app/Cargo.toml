[package]
name = "aurastudio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aurastudio"
path = "src/main.rs"

[dependencies]
aurastudio-canvas = { path = "../aurastudio-canvas" }
aurastudio-brush  = { path = "../aurastudio-brush" }
aurastudio-input  = { path = "../aurastudio-input" }
aurastudio-gpu    = { path = "../aurastudio-gpu" }
winit             = "0.30"
wgpu              = "0.20"
pollster          = "0.3"
env_logger        = "0.11"
log               = "0.4"
raw-window-handle = "0.6"
