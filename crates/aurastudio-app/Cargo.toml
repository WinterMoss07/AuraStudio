[package]
name = "aurastudio"
version.workspace = true
edition = "2021"

[[bin]]
name = "aurastudio"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The app's allocator: mimalloc, or the system's without this feature
# (--no-default-features), to compare them (README, Profiling).
mimalloc = ["dep:mimalloc"]
# Tracy profiler: zones, frames and plots for the Tracy window (README,
# Profiling). Off: the profiling macros compile to nothing.
profile = ["profiling/profile-with-tracy", "dep:tracy-client"]

[dependencies]
profiling = "1"
# Same version as the one profiling uses (one Tracy client).
tracy-client = { version = "0.19", optional = true }
aurastudio-core = { path = "../aurastudio-core" }
aurastudio-tools = { path = "../aurastudio-tools" }
aurastudio-forge  = { path = "../aurastudio-forge" }
aurastudio-input  = { path = "../aurastudio-input" }
aurastudio-gpu    = { path = "../aurastudio-gpu" }
winit             = "0.30"
pollster          = "0.3"
env_logger        = "0.11"
log               = "0.4"
raw-window-handle = "0.6"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
aurastudio-animation = { path = "../aurastudio-animation" }
aurastudio-layers = { path = "../aurastudio-layers" }
aurastudio-transform = { path = "../aurastudio-transform" }
aurastudio-selection = { path = "../aurastudio-selection" }
aurastudio-document = { path = "../aurastudio-document" }
aurastudio-file = { path = "../aurastudio-file" }
aurastudio-filters = { path = "../aurastudio-filters" }
dirs = "7"
aurastudio-color    = { path = "../aurastudio-color" }
aurastudio-forge-library  = { path = "../aurastudio-forge-library" }
aurastudio-ui = { path = "../aurastudio-ui" }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
# System clipboard: images copied to / from other apps.
arboard = { version = "3", default-features = false, features = ["image-data"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
mimalloc = { version = "0.1", optional = true }

# The .exe icon (Windows resource), see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Memory report: the process's working set and private bytes.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Memory"] }
