[package]
name = "aurastudio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aurastudio"
path = "src/main.rs"

[dependencies]
aurastudio-canvas = { version = "0.1.0", path = "../aurastudio-canvas" }
aurastudio-brush  = { path = "../aurastudio-brush" }
aurastudio-input  = { path = "../aurastudio-input" }
aurastudio-gpu    = { path = "../aurastudio-gpu" }
winit             = "0.30"
wgpu              = "23"
pollster          = "0.3"
env_logger        = "0.11"
log               = "0.4"
raw-window-handle = "0.6"
egui-wgpu = "0.30"
egui = "0.30"
egui-winit = "0.30"
aurastudio-layers = { version = "0.1.0", path = "../aurastudio-layers" }
aurastudio-document = { path = "../aurastudio-document" }
aurastudio-color    = { path = "../aurastudio-color" }
aurastudio-brushes  = { path = "../aurastudio-brushes" }
aurastudio-ui = { version = "0.1.0", path = "../aurastudio-ui" }
rfd = "0.17"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
