[package]
name = "aurastudio"
version.workspace = true
edition = "2021"

[[bin]]
name = "aurastudio"
path = "src/main.rs"

[dependencies]
aurastudio-canvas = { path = "../aurastudio-canvas" }
aurastudio-brush  = { path = "../aurastudio-brush" }
aurastudio-input  = { path = "../aurastudio-input" }
aurastudio-gpu    = { path = "../aurastudio-gpu" }
winit             = "0.30"
wgpu              = "23"
pollster          = "0.3"
env_logger        = "0.11"
log               = "0.4"
raw-window-handle = "0.6"
egui-wgpu = "0.30"
egui = "0.30"
egui-winit = "0.30"
aurastudio-layers = { path = "../aurastudio-layers" }
aurastudio-document = { path = "../aurastudio-document" }
aurastudio-file = { path = "../aurastudio-file" }
dirs = "7"
aurastudio-color    = { path = "../aurastudio-color" }
aurastudio-brushes  = { path = "../aurastudio-brushes" }
aurastudio-ui = { path = "../aurastudio-ui" }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
# System clipboard: images copied to / from other apps.
arboard = { version = "3", default-features = false, features = ["image-data"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

# The .exe icon (Windows resource), see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
