[package]
name = "aurastudio-stress"
version.workspace = true
edition = "2021"
publish = false
description = "Dev only: fuzzers and diagnostic scenarios. Nothing depends on it."

[dependencies]
aurastudio-color = { path = "../aurastudio-color" }
aurastudio-core = { path = "../aurastudio-core", features = ["diag"] }
aurastudio-diag = { path = "../aurastudio-diag" }
aurastudio-filters = { path = "../aurastudio-filters" }
aurastudio-raster = { path = "../aurastudio-raster" }
aurastudio-selection = { path = "../aurastudio-selection" }
aurastudio-tools = { path = "../aurastudio-tools" }
aurastudio-transform = { path = "../aurastudio-transform" }
