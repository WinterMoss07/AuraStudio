[package]
name = "aurastudio-forge"
version.workspace = true
edition = "2024"

[dependencies]
aurastudio-core = { path = "../aurastudio-core" }
rayon      = "1"
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rustc-hash = "1"
# The library's tip files; importers: Photoshop .abr (ZIP-compressed planes),
# Procreate .brush (ZIP of PNG tips).
flate2     = "1"
crc32fast  = "1"
thiserror  = "1"
roxmltree  = "0.20"
image      = { version = "0.25", default-features = false, features = ["png"] }
