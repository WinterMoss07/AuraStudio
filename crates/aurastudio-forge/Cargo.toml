[package]
name = "aurastudio-forge"
version.workspace = true
edition = "2021"

[dependencies]
aurastudio-core = { path = "../aurastudio-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Worker threads kept between dabs (starting threads for each big dab
# cost 60-200 µs, more on Windows).
rayon = "1"
profiling = "1"

[dev-dependencies]
png = "0.18"
