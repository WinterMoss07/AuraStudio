[package]
name = "aurastudio-file"
version.workspace = true
edition = "2021"

[dependencies]
aurastudio-core   = { path = "../aurastudio-core" }
aurastudio-layers   = { path = "../aurastudio-layers" }
aurastudio-raster = { path = "../aurastudio-raster" }
aurastudio-document = { path = "../aurastudio-document" }
aurastudio-filters  = { path = "../aurastudio-filters" }
lz4_flex   = "0.14"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Stored entries only: the layers are LZ4-compressed already.
zip        = { version = "9", default-features = false }
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
profiling = "1"
