edition = "2021"

[dependencies]
aurastudio-core = { path = "../aurastudio-core" }
moxcms = "0.9"
rayon  = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
] }
