[package]
name = "aurastudio-input"
version = "0.1.0"
edition = "2021"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
crossbeam-queue = "0.3"
efude-input      = { version = "0.1.0", optional = true }

[features]
# A/B comparison: build with `--features aurastudio-input/efude-upstream`
# to use the efude-input crate's WindowsInkHook / WintabHook as-is instead
# of our vendored, optimized copy. Tells whether some latency comes from
# the native hook itself or from our pipeline.
efude-upstream = ["dep:efude-input"]
