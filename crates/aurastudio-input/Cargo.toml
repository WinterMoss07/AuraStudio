[package]
name = "aurastudio-input"
version = "0.1.0"
edition = "2021"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
crossbeam-queue = "0.3"
efude-input      = { version = "0.1.0", optional = true }

[features]
# A/B comparaison : build avec `--features aurastudio-input/efude-upstream`
# pour utiliser les hooks WindowsInkHook/WintabHook du crate efude-input tel
# quel, au lieu de notre version vendored/optimisée. Sert à isoler si une
# latence observée vient du hook natif lui-même ou de notre pipeline.
efude-upstream = ["dep:efude-input"]
